<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="18" font-weight="bold" fill="#202124">全体の構成（曲と音源がどこを通って公開されるか）</text>

  <!-- JPKeysJam (既存) -->
  <rect x="24" y="64" width="264" height="312" rx="8" fill="none" stroke="#80868B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="88" font-size="14" font-weight="bold" fill="#202124">JPKeysJam（private・iOS）</text>

  <rect x="48" y="104" width="216" height="64" rx="8" fill="#F1F3F4" stroke="#80868B" stroke-width="2"/>
  <text x="156" y="132" font-size="14" fill="#202124" text-anchor="middle">Resources/Songs</text>
  <text x="156" y="152" font-size="12" fill="#5F6368" text-anchor="middle">公開分 pd 133 曲・試聴</text>

  <rect x="48" y="192" width="216" height="64" rx="8" fill="#FCE8E6" stroke="#D93025" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="156" y="220" font-size="14" fill="#202124" text-anchor="middle">Resources/SongsDev</text>
  <text x="156" y="240" font-size="12" fill="#5F6368" text-anchor="middle">全曲。Web には入れない</text>

  <rect x="48" y="280" width="216" height="72" rx="8" fill="#F1F3F4" stroke="#80868B" stroke-width="2"/>
  <text x="156" y="308" font-size="14" fill="#202124" text-anchor="middle">GeneralUser-GS.sf2</text>
  <text x="156" y="328" font-size="12" fill="#5F6368" text-anchor="middle">32MB・全音色</text>

  <!-- JPKeysJamWeb (新規) -->
  <rect x="352" y="64" width="320" height="312" rx="8" fill="none" stroke="#3B6FD8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="368" y="88" font-size="14" font-weight="bold" fill="#202124">JPKeysJamWeb（public・新規）</text>

  <rect x="376" y="104" width="272" height="64" rx="8" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="512" y="132" font-size="14" fill="#202124" text-anchor="middle">public/songs</text>
  <text x="512" y="152" font-size="12" fill="#5F6368" text-anchor="middle">tools/sync_songs.mjs でコピー</text>

  <rect x="376" y="192" width="272" height="64" rx="8" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="512" y="220" font-size="14" fill="#202124" text-anchor="middle">src（React＋TypeScript）</text>
  <text x="512" y="240" font-size="12" fill="#5F6368" text-anchor="middle">ガイドの判定は Swift から移植</text>

  <rect x="376" y="280" width="272" height="72" rx="8" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="512" y="308" font-size="14" fill="#202124" text-anchor="middle">public/soundfont/piano.sf3</text>
  <text x="512" y="328" font-size="12" fill="#5F6368" text-anchor="middle">ピアノだけ・数 MB</text>

  <!-- arrows repo->web -->
  <line x1="264" y1="136" x2="372" y2="136" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="128" font-size="12" fill="#5F6368" text-anchor="middle">コピー</text>
  <line x1="264" y1="316" x2="372" y2="316" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="308" font-size="12" fill="#5F6368" text-anchor="middle">抜き出す</text>

  <!-- GitHub Pages -->
  <rect x="736" y="176" width="200" height="96" rx="8" fill="#FEF3E2" stroke="#E08A00" stroke-width="2"/>
  <text x="836" y="208" font-size="14" fill="#202124" text-anchor="middle">GitHub Pages</text>
  <text x="836" y="230" font-size="12" fill="#5F6368" text-anchor="middle">Actions で build・公開</text>
  <text x="836" y="250" font-size="12" fill="#5F6368" text-anchor="middle">/JPKeysJamWeb/</text>
  <line x1="672" y1="224" x2="732" y2="224" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702" y="214" font-size="12" fill="#5F6368" text-anchor="middle">push</text>

  <!-- Android -->
  <rect x="736" y="320" width="200" height="88" rx="8" fill="#FEF3E2" stroke="#E08A00" stroke-width="2"/>
  <text x="836" y="352" font-size="14" fill="#202124" text-anchor="middle">Android の Chrome</text>
  <text x="836" y="374" font-size="12" fill="#5F6368" text-anchor="middle">ホーム画面に入れる（PWA）</text>
  <line x1="836" y1="272" x2="836" y2="316" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="848" y="300" font-size="12" fill="#5F6368">HTTPS</text>

  <!-- MIDI keyboard -->
  <rect x="736" y="432" width="200" height="56" rx="8" fill="#FEF3E2" stroke="#E08A00" stroke-width="2"/>
  <text x="836" y="465" font-size="14" fill="#202124" text-anchor="middle">JP-MIDIKey（USB）</text>
  <line x1="836" y1="432" x2="836" y2="412" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="848" y="426" font-size="12" fill="#5F6368">Web MIDI（OTG）</text>

  <!-- legend -->
  <rect x="24" y="456" width="16" height="16" fill="#E8F0FE" stroke="#3B6FD8"/>
  <text x="48" y="469" font-size="12" fill="#5F6368">新しく作る</text>
  <rect x="136" y="456" width="16" height="16" fill="#F1F3F4" stroke="#80868B"/>
  <text x="160" y="469" font-size="12" fill="#5F6368">既にある（触らない）</text>
  <rect x="304" y="456" width="16" height="16" fill="#FEF3E2" stroke="#E08A00"/>
  <text x="328" y="469" font-size="12" fill="#5F6368">外のもの</text>
  <rect x="408" y="456" width="16" height="16" fill="#FCE8E6" stroke="#D93025"/>
  <text x="432" y="469" font-size="12" fill="#5F6368">持ち込まない</text>
  <text x="24" y="500" font-size="12" fill="#5F6368">JPKeysJam 側は読むだけ。曲を増減したら JPKeysJamWeb で sync_songs.mjs を流し直してコミットする</text>
</svg>
